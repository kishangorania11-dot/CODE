name: Telegram Test

on:
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send test Telegram message
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Test message from your GitHub Actions job scanner setup. If you see this, the pipeline works."
