name: Discover SadTalker Space API

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gradio_client==1.4.3

      - name: Run discovery script
        run: python scripts/discover_sadtalker_api.py
